[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-procurement-agent-plugin"
version = "0.1.0"
description = "Read-only InvenTree procurement task integration spike"
requires-python = ">=3.11"
dependencies = []

[project.entry-points.inventree_plugins]
InvenTreeProcurementAgent = "inventree_procurement_plugin.plugin:InvenTreeProcurementAgent"

[tool.setuptools.packages.find]
include = ["inventree_procurement_plugin*"]

[tool.setuptools.package-data]
inventree_procurement_plugin = ["static/*.js"]
