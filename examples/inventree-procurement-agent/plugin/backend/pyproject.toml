[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-procurement-agent-plugin"
version = "0.1.0"
description = "InvenTree procurement task and read-only preview integration spike"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["deepagents>=0.7.19,<0.8", "langchain-deepseek>=1.1,<2"]

[project.entry-points.inventree_plugins]
InvenTreeProcurementAgent = "inventree_procurement_plugin.plugin:InvenTreeProcurementAgent"

[tool.setuptools.packages.find]
include = ["inventree_procurement_plugin*"]

[tool.setuptools.package-data]
inventree_procurement_plugin = ["static/*.js"]
